name: Android build

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, fix/full-simulator-hybrid ]
    paths-ignore:
      - 'updates/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Verify project layout
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/br/com/colecaocf/MainActivity.java
          grep -q 'addAlgorithomusExitButton' app/src/main/java/br/com/colecaocf/MainActivity.java
          test -f app/src/main/java/br/com/colecaocf/UpdateSignatureVerifier.java
          test -f app/src/main/assets/bundle_parts/00.b64
          test -f app/src/main/assets/bundle_parts/24.b64
          test -f app/src/main/assets/frutris-exit-fix.css
          test -s app/src/main/res/drawable-nodpi/ic_launcher_cfa.webp
          test -f tools/mirror_site.py
          test -f updates/latest.json
          test -f updates/latest.json.sig.b64

      - name: Reconstruct and validate the two original games
        run: |
          gradle --no-daemon :app:prepareGameBundle
          unzip -t app/src/main/assets/games.bundle.zip
          unzip -l app/src/main/assets/games.bundle.zip | grep -E 'apps/(frutris|cobrinha)/index.html|assets/img/Icones/(frutris|cobrinha).webp|js/exit-game.js'

      - name: Mirror the Algorithomus site (offline game content)
        run: |
          python3 tools/mirror_site.py
          test -f app/src/main/assets/site/index.html

      - name: Validate the mirrored Algorithomus content
        run: |
          SITE="app/src/main/assets/site"
          test -s "$SITE/index.html"
          test -s "$SITE/media-manifest.json"
          grep -q "Algorithomus" "$SITE/index.html"
          if grep -qiE "cf-chl|Just a moment|Attention Required" "$SITE/index.html"; then
            echo "::error::O espelho do Algorithomus recebeu uma pagina de bloqueio (Cloudflare) em vez do jogo real. Rode o workflow novamente."
            exit 1
          fi
          for page in \
            apps/mensagens/index.html apps/y/index.html apps/telefone/index.html \
            apps/galeria/index.html apps/tetris/index.html apps/cobrinha/index.html \
            apps/calculadora/index.html apps/configuracoes/index.html \
            apps/sem-nome/index.html apps/sem-nome/rabiscos/index.html; do
            test -s "$SITE/$page" || { echo "::error::Pagina obrigatoria ausente: $page"; exit 1; }
          done
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("app/src/main/assets/site")
          manifest = json.loads((root / "media-manifest.json").read_text(encoding="utf-8"))
          missing = []
          for asset in manifest.get("assets", []):
              path = asset.get("url")
              if isinstance(path, str) and path:
                  local = root / path.split("?", 1)[0].lstrip("/")
                  if not local.is_file():
                      missing.append(path)
          if missing:
              print("::error::Midias primarias ausentes do espelho:")
              for path in missing:
                  print(" - " + path)
              sys.exit(1)
          print("Manifesto e mídias primárias validados.")
          PY
          test -n "$(find "$SITE" -name '*.js' -print -quit)"

      - name: Load permanent Android signing key (optional until repository secret is saved)
        id: signing
        env:
          CF_ANDROID_SIGNING_PACKAGE_B64: ${{ secrets.CF_ANDROID_SIGNING_PACKAGE_B64 }}
        run: |
          if [ -z "$CF_ANDROID_SIGNING_PACKAGE_B64" ]; then
            echo "CF_STABLE_SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "::warning::Pacote de assinatura permanente ainda nao cadastrado. Somente um APK de desenvolvimento (certificado temporario) sera publicado em pre-lancamento. Nenhum APK/AAB estavel sera publicado ate o segredo CF_ANDROID_SIGNING_PACKAGE_B64 ser cadastrado."
            {
              echo "### Assinatura permanente pendente"
              echo "A compilacao produzira um APK de desenvolvimento (certificado temporario), publicado como pre-lancamento com link de download. O APK/AAB estavel exige o segredo CF_ANDROID_SIGNING_PACKAGE_B64."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set -euo pipefail
          printf '%s' "$CF_ANDROID_SIGNING_PACKAGE_B64" | base64 --decode > "$RUNNER_TEMP/cf-signing-package.zip"
          python3 - "$RUNNER_TEMP/cf-signing-package.zip" "$RUNNER_TEMP" <<'PY'
          import json, os, sys, zipfile
          archive_path, target = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(archive_path) as archive:
              expected = {"cf-android-signing.jks", "signing.json"}
              if set(archive.namelist()) != expected:
                  raise SystemExit("Pacote de assinatura invalido: conteudo inesperado.")
              key = archive.read("cf-android-signing.jks")
              config = json.loads(archive.read("signing.json"))
          if not key or len(key) > 65536:
              raise SystemExit("Keystore ausente ou invalida.")
          required = ("storePassword", "keyAlias", "keyPassword")
          if any(not isinstance(config.get(k), str) or not config[k] or "\n" in config[k] for k in required):
              raise SystemExit("Configuracao de assinatura incompleta.")
          key_path = os.path.join(target, "cf-android-signing.jks")
          with open(key_path, "wb") as output:
              output.write(key)
          import subprocess
          subprocess.run([
              "keytool", "-list", "-keystore", key_path,
              "-storepass", config["storePassword"],
              "-alias", config["keyAlias"]
          ], check=True, stdout=subprocess.DEVNULL)
          values = {
              "CF_ANDROID_KEYSTORE_PATH": key_path,
              "CF_ANDROID_KEYSTORE_PASSWORD": config["storePassword"],
              "CF_ANDROID_KEY_ALIAS": config["keyAlias"],
              "CF_ANDROID_KEY_PASSWORD": config["keyPassword"],
              "CF_STABLE_SIGNING_AVAILABLE": "true"
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for name, value in values.items():
                  env.write(f"{name}={value}\n")
          PY
          echo "Assinatura permanente validada."
          {
            echo "### Assinatura permanente validada"
            echo "O APK/AAB sera gerado com o certificado permanente C-F-A."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build APK and AAB with permanent signature
        if: env.CF_STABLE_SIGNING_AVAILABLE == 'true'
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Build development APK when permanent signature is not configured
        if: env.CF_STABLE_SIGNING_AVAILABLE != 'true'
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK signature, package metadata, and launcher icon
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          if [ "$CF_STABLE_SIGNING_AVAILABLE" = "true" ]; then
            APK="app/build/outputs/apk/release/app-release.apk"
            EXPECTED_ID="br.com.cfa"
          else
            APK="app/build/outputs/apk/debug/app-debug.apk"
            EXPECTED_ID="br.com.cfa.debug"
          fi
          test -s "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          printf '%s\\n' "$BADGING"
          printf '%s\\n' "$BADGING" | grep -F "package: name='$EXPECTED_ID'"
          printf '%s\\n' "$BADGING" | grep -E "application:.*icon="
          printf '%s\\n' "$BADGING" | grep -F "launchable-activity:"
          unzip -Z1 "$APK" | grep -Fx "res/mipmap-anydpi-v26/ic_launcher.xml"
          unzip -Z1 "$APK" | grep -Fx "res/mipmap-nodpi/ic_launcher.webp"
          unzip -Z1 "$APK" | grep -Fx "res/drawable/ic_launcher_foreground.xml"
          unzip -Z1 "$APK" | grep -Fx "res/drawable-nodpi/ic_launcher_cfa.webp"
          echo "APK assinado, pacote e ícone adaptativo validados."

      - name: Compose artifact name from versionName
        run: |
          version="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::versionName nao encontrado em app/build.gradle."
            exit 1
          fi
          if [ "$CF_STABLE_SIGNING_AVAILABLE" = "true" ]; then
            echo "CF_ARTIFACT_NAME=CFA-Android-${version}-stable-signed" >> "$GITHUB_ENV"
          else
            echo "CF_ARTIFACT_NAME=CFA-Android-${version}-debug" >> "$GITHUB_ENV"
          fi

      - name: Publish the next signed game update (when the repository secret is configured)
        if: github.ref == 'refs/heads/main'
        env:
          CF_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.CF_UPDATE_PRIVATE_KEY_PEM }}
        run: |
          if [ -z "$CF_UPDATE_PRIVATE_KEY_PEM" ]; then
            echo "::warning::Configure o segredo CF_UPDATE_PRIVATE_KEY_PEM para assinar e publicar futuras atualizacoes OTA."
            exit 0
          fi
          mkdir -p updates
          base64 -w0 app/src/main/assets/games.bundle.zip > updates/games.bundle.zip.b64
          python3 - <<'PY'
          import hashlib, json, os
          bundle = open("app/src/main/assets/games.bundle.zip", "rb").read()
          manifest = {
              "schema": 1,
              "bundleVersion": int(os.environ["GITHUB_RUN_NUMBER"]),
              "bundleUrl": "https://raw.githubusercontent.com/768ull/C-F/main/updates/games.bundle.zip.b64",
              "sha256": hashlib.sha256(bundle).hexdigest(),
              "description": "Atualizacao assinada dos jogos C-F"
          }
          with open("updates/latest.json", "w", encoding="utf-8", newline="\n") as f:
              json.dump(manifest, f, ensure_ascii=False, separators=(",", ":"))
              f.write("\n")
          PY
          printf '%s' "$CF_UPDATE_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/cf-update-private.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/cf-update-private.pem" -out "$RUNNER_TEMP/latest.sig" updates/latest.json
          base64 -w0 "$RUNNER_TEMP/latest.sig" > updates/latest.json.sig.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json updates/latest.json.sig.b64 updates/games.bundle.zip.b64
          if ! git diff --cached --quiet; then
            git commit -m "Publish signed C-F game update"
            git push
          fi

      - name: Upload Android artifacts signed with the permanent key
        if: env.CF_STABLE_SIGNING_AVAILABLE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CF_ARTIFACT_NAME }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload development APK while permanent signature is pending
        if: env.CF_STABLE_SIGNING_AVAILABLE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CF_ARTIFACT_NAME }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK in the versions menu (permanent download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)"
          if [ "$CF_STABLE_SIGNING_AVAILABLE" = "true" ]; then
            APK="app/build/outputs/apk/release/app-release.apk"
            TAG="v${version}"
            FILE="CFA-Android-${version}.apk"
            TITLE="C-F-A v${version} (stable signed)"
            NOTES="APK assinado com o certificado permanente C-F-A. Instalacao direta."
            PRE=""
          else
            APK="app/build/outputs/apk/debug/app-debug.apk"
            TAG="v${version}-debug"
            FILE="CFA-Android-${version}-debug.apk"
            TITLE="C-F-A v${version} (development build)"
            NOTES="APK de desenvolvimento assinado com certificado temporario (pacote br.com.cfa.debug). Cada nova versao de desenvolvimento exige desinstalar a versao de desenvolvimento anterior antes de instalar esta. A versao estavel, com certificado permanente, sera publicada quando o segredo CF_ANDROID_SIGNING_PACKAGE_B64 for cadastrado no repositorio."
            PRE="--prerelease"
          fi
          cp "$APK" "$FILE"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber -R "$GITHUB_REPOSITORY"
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" "$FILE" --title "$TITLE" --target "$GITHUB_SHA" --notes "$NOTES" $PRE -R "$GITHUB_REPOSITORY"
          fi
