name: Android build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'updates/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify project layout
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/br/com/colecaocf/MainActivity.java
          test -f app/src/main/assets/bundle_parts/00.b64
          test -f app/src/main/assets/frutris-exit-fix.css
          test -f updates/latest.json
          test -f updates/latest.json.sig.b64

      - name: Reconstruct and validate the two original games
        run: |
          gradle --no-daemon :app:prepareGameBundle
          unzip -t app/src/main/assets/games.bundle.zip
          unzip -l app/src/main/assets/games.bundle.zip | grep -E 'apps/(frutris|cobrinha)/index.html|assets/img/Icones/(frutris|cobrinha).webp|js/exit-game.js'

      - name: Publish the next signed game update (when the repository secret is configured)
        env:
          CF_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.CF_UPDATE_PRIVATE_KEY_PEM }}
        run: |
          if [ -z "$CF_UPDATE_PRIVATE_KEY_PEM" ]; then
            echo "::warning::Configure o segredo CF_UPDATE_PRIVATE_KEY_PEM para assinar e publicar futuras atualizações OTA."
            exit 0
          fi
          mkdir -p updates
          base64 -w0 app/src/main/assets/games.bundle.zip > updates/games.bundle.zip.b64
          python3 - <<'PY'
          import hashlib, json, os
          bundle = open("app/src/main/assets/games.bundle.zip", "rb").read()
          manifest = {
              "schema": 1,
              "bundleVersion": int(os.environ["GITHUB_RUN_NUMBER"]),
              "bundleUrl": "https://raw.githubusercontent.com/768ull/C-F/main/updates/games.bundle.zip.b64",
              "sha256": hashlib.sha256(bundle).hexdigest(),
              "description": "Atualização assinada dos jogos C-F"
          }
          with open("updates/latest.json", "w", encoding="utf-8", newline="\n") as f:
              json.dump(manifest, f, ensure_ascii=False, separators=(",", ":"))
              f.write("\n")
          PY
          printf '%s' "$CF_UPDATE_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/cf-update-private.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/cf-update-private.pem" -out "$RUNNER_TEMP/latest.sig" updates/latest.json
          base64 -w0 "$RUNNER_TEMP/latest.sig" > updates/latest.json.sig.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json updates/latest.json.sig.b64 updates/games.bundle.zip.b64
          if ! git diff --cached --quiet; then
            git commit -m "Publish signed C-F game update"
            git push
          fi

      - name: Load permanent Android signing key (optional until repository secret is saved)
        id: signing
        env:
          CF_ANDROID_SIGNING_PACKAGE_B64: ${{ secrets.CF_ANDROID_SIGNING_PACKAGE_B64 }}
        run: |
          if [ -z "$CF_ANDROID_SIGNING_PACKAGE_B64" ]; then
            echo "CF_STABLE_SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "::warning::Pacote de assinatura permanente ainda não cadastrado. Nenhum APK/AAB será publicado nesta execução para evitar certificado temporário incompatível."
            {
              echo "### Assinatura permanente pendente"
              echo "A compilação validará os fontes, mas não publicará APK/AAB até o segredo CF_ANDROID_SIGNING_PACKAGE_B64 ser cadastrado."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set -euo pipefail
          printf '%s' "$CF_ANDROID_SIGNING_PACKAGE_B64" | base64 --decode > "$RUNNER_TEMP/cf-signing-package.zip"
          python3 - "$RUNNER_TEMP/cf-signing-package.zip" "$RUNNER_TEMP" <<'PY'
          import json, os, sys, zipfile
          archive_path, target = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(archive_path) as archive:
              expected = {"cf-android-signing.jks", "signing.json"}
              if set(archive.namelist()) != expected:
                  raise SystemExit("Pacote de assinatura inválido: conteúdo inesperado.")
              key = archive.read("cf-android-signing.jks")
              config = json.loads(archive.read("signing.json"))
          if not key or len(key) > 65536:
              raise SystemExit("Keystore ausente ou inválida.")
          required = ("storePassword", "keyAlias", "keyPassword")
          if any(not isinstance(config.get(k), str) or not config[k] or "\n" in config[k] for k in required):
              raise SystemExit("Configuração de assinatura incompleta.")
          key_path = os.path.join(target, "cf-android-signing.jks")
          with open(key_path, "wb") as output:
              output.write(key)
          import subprocess
          subprocess.run([
              "keytool", "-list", "-keystore", key_path,
              "-storepass", config["storePassword"],
              "-alias", config["keyAlias"]
          ], check=True, stdout=subprocess.DEVNULL)
          values = {
              "CF_ANDROID_KEYSTORE_PATH": key_path,
              "CF_ANDROID_KEYSTORE_PASSWORD": config["storePassword"],
              "CF_ANDROID_KEY_ALIAS": config["keyAlias"],
              "CF_ANDROID_KEY_PASSWORD": config["keyPassword"],
              "CF_STABLE_SIGNING_AVAILABLE": "true"
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for name, value in values.items():
                  env.write(f"{name}={value}\n")
          PY
          echo "Assinatura permanente validada."
          {
            echo "### Assinatura permanente validada"
            echo "O APK/AAB será gerado com o certificado permanente C-F."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build APK and AAB with permanent signature
        if: env.CF_STABLE_SIGNING_AVAILABLE == 'true'
        run: gradle --no-daemon :app:assembleDebug :app:bundleDebug

      - name: Validate Android sources when permanent signature is not configured
        if: env.CF_STABLE_SIGNING_AVAILABLE != 'true'
        run: gradle --no-daemon :app:compileDebugJavaWithJavac

      - name: Upload Android artifacts signed with the permanent key
        if: env.CF_STABLE_SIGNING_AVAILABLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CF-Collection-Android-1.1.2-stable-signed
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
