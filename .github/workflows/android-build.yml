name: Android build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify project layout
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/br/com/colecaocf/MainActivity.java
          test -f app/src/main/assets/bundle_parts/00.b64

      - name: Reconstruct and validate the two original games
        run: |
          gradle --no-daemon :app:prepareGameBundle
          unzip -t app/src/main/assets/games.bundle.zip
          unzip -l app/src/main/assets/games.bundle.zip | grep -E 'apps/(frutris|cobrinha)/index.html|assets/img/Icones/(frutris|cobrinha).webp|js/exit-game.js'

      - name: Build APK and AAB
        run: gradle --no-daemon :app:assembleDebug :app:bundleDebug

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CF-Collection-Android
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
