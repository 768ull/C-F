plugins {
    id "com.android.application"
}

android {
    namespace "br.com.colecaocf"
    compileSdk 36

    defaultConfig {
        applicationId "br.com.cfa"
        minSdk 24
        targetSdk 35
        versionCode 25
        versionName "1.2.15"
    }

    signingConfigs {
        // Public, development-only key: stabilizes upgrades for br.com.cfa.debug.
        // Production releases continue to use the private GitHub signing secret.
        development {
            storeFile file("cfa-development.jks")
            storePassword "CFA-Public-Debug-2026"
            keyAlias "cfa-development"
            keyPassword "CFA-Public-Debug-2026"
            // Assinatura v1 (JAR) + v2 + v3 para máxima compatibilidade de
            // instalação. Sem estas linhas o AGP omite a assinatura JAR quando
            // minSdk >= 24 e instaladores legados rejeitam o pacote.
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
        if (System.getenv("CF_ANDROID_KEYSTORE_PATH")) {
            stable {
                storeFile file(System.getenv("CF_ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("CF_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CF_ANDROID_KEY_ALIAS") ?: "cf-release"
                keyPassword System.getenv("CF_ANDROID_KEY_PASSWORD")
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            if (System.getenv("CF_ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.stable
            } else {
                signingConfig signingConfigs.development
            }
        }
        release {
            minifyEnabled false
            if (System.getenv("CF_ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.stable
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.18.0"
}

def gamePartsDir = file("src/main/assets/bundle_parts")
def gameBundleFile = file("src/main/assets/games.bundle.zip")

tasks.register("prepareGameBundle") {
    inputs.dir(gamePartsDir)
    outputs.file(gameBundleFile)

    doLast {
        def parts = (gamePartsDir.listFiles() ?: [])
            .findAll { it.isFile() && it.name ==~ /[0-9]{2}\.b64/ }
            .sort { a, b -> a.name <=> b.name }

        if (parts.size() != 25) {
            throw new GradleException(
                "Pacote de jogos incompleto: esperados 25 segmentos Base64 (00 a 24), encontrados ${parts.size()}."
            )
        }

        def expectedNames = (0..24).collect { String.format("%02d.b64", it) }
        def actualNames = parts.collect { it.name }
        if (actualNames != expectedNames) {
            throw new GradleException("Segmentos ausentes ou fora da sequência. Esperado: ${expectedNames}; encontrado: ${actualNames}")
        }

        String encoded = parts.collect { it.getText("UTF-8").trim() }.join("")
        byte[] archive
        try {
            archive = java.util.Base64.getDecoder().decode(encoded)
        } catch (Exception ex) {
            throw new GradleException("Os segmentos do pacote de jogos não formam Base64 válido.", ex)
        }

        def digest = java.security.MessageDigest.getInstance("SHA-256").digest(archive)
        def sha256 = digest.collect { String.format("%02x", it) }.join()
        def expectedSha256 = "3c9cfdb4490d057a951e6254db40ef02200ef59023b12b4c9328ec6dac9c7a77"
        if (sha256 != expectedSha256) {
            throw new GradleException("Integridade do pacote de jogos inválida. SHA-256 obtido: ${sha256}")
        }

        gameBundleFile.parentFile.mkdirs()
        gameBundleFile.bytes = archive

        def requiredEntries = [
            "apps/frutris/index.html",
            "apps/cobrinha/index.html",
            "assets/img/Icones/frutris.webp",
            "assets/img/Icones/cobrinha.webp",
            "js/exit-game.js"
        ]
        def zip = new java.util.zip.ZipFile(gameBundleFile)
        try {
            def missing = requiredEntries.findAll { zip.getEntry(it) == null }
            if (!missing.isEmpty()) {
                throw new GradleException("O pacote de jogos não contém todos os arquivos necessários: ${missing}")
            }
        } finally {
            zip.close()
        }

        logger.lifecycle("Pacote original C-F validado: ${archive.length} bytes, SHA-256 ${sha256}.")
    }
}

tasks.named("preBuild").configure {
    dependsOn("prepareGameBundle")
}
