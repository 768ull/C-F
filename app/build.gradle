plugins {
    id "com.android.application"
}

android {
    namespace "br.com.colecaocf"
    compileSdk 36

    defaultConfig {
        applicationId "br.com.colecaocf"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "1.0.2"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.18.0"
}

def bundleFile = file("src/main/assets/games.bundle.zip")
def bundleB64 = rootProject.file(".github/game-bundle/games.bundle.zip.b64")
tasks.register("prepareGameBundle") {
    inputs.file(bundleB64)
    outputs.file(bundleFile)
    doLast {
        if (bundleFile.isFile()) return
        if (!bundleB64.isFile()) throw new GradleException("Missing .github/game-bundle/games.bundle.zip.b64")
        bundleFile.parentFile.mkdirs()
        bundleFile.bytes = java.util.Base64.getMimeDecoder().decode(bundleB64.getText("UTF-8"))
    }
}
tasks.named("preBuild").configure { dependsOn("prepareGameBundle") }
